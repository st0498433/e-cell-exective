<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cell SMVIT - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0b14;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 170px;
        }

        .card {
            background: #151522;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #29293d;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #0f0f1b;
            border: 1px solid #35354d;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #7c3aed;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .signup a,
        .home {
            color: #a78bfa;
            text-decoration: none;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <img
                src="https://ik.imagekit.io/es6xialea/logowithoutname_FRoJAY4ve?updatedAt=1755297005039"
                alt="E-Cell SMVIT Logo"
            >
        </div>

        <div class="card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your E-Cell account
            </p>

            <form id="loginForm">

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <a href="index.html" class="home">← Back to Home</a>

        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
